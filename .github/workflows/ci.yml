name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        symfony: ['7.4.*', '8.0.*']
        exclude:
          - php: '8.3'
            symfony: '8.0.*'
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
      - run: >
          composer update --no-interaction --prefer-dist
          --with 'symfony/config:${{ matrix.symfony }}'
          --with 'symfony/console:${{ matrix.symfony }}'
          --with 'symfony/dependency-injection:${{ matrix.symfony }}'
          --with 'symfony/http-kernel:${{ matrix.symfony }}'
          --with 'symfony/event-dispatcher:${{ matrix.symfony }}'
          --with 'symfony/framework-bundle:${{ matrix.symfony }}'
          --with 'symfony/var-exporter:${{ matrix.symfony }}'
      - run: composer check
